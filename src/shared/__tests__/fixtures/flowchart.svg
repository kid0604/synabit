<!--
  A real Mermaid 11 flowchart, drawn by the app's own renderer and then cut
  down to what a converter reads: the five kilobytes of theme CSS and the
  dozen arrow markers are gone, every coordinate is exactly as Mermaid
  produced it.

  The source was a `flowchart TB` with two subgraphs, DC1 ["DC1 — Nội bộ"]
  holding K1 ["Kong API Gateway"] above F1 ["F5 TPZ"], DC2 ["DC2 — Dự phòng"]
  holding K2 and F2 the same way, a node T ["TCTV"] linked into K1 with the
  label MPLS and into K2 without one, and a two-headed link between F1 and F2.
  (Written out rather than pasted: an XML comment cannot contain two hyphens
  in a row, and a Mermaid arrow is exactly that.)

  Which is the shape of the drawing this conversion was built for, and the
  lopsidedness too: DC1 sits 129 pixels lower than DC2 and nobody asked it to.
-->
