<!-- SynVisuals/3064d268df7c40b0b449b0579af71fb6.md, "So sánh hai cách trả khoản vay", gpt-6-luna, 2026-10-28.
     The answer under this visual said the interest came to 568,1 and 376,9 million; the visual works out 579,7 and 451,9.
     Changed from the original: the visual reports its two totals with `synabit.report`; the proof is the two figures the answer gave. -->
<div style="max-width:640px;color:var(--text)"><div class="row" style="gap:14px;flex-wrap:wrap"><label>Lãi suất: <span id="rateVal"></span>%/năm<br><input id="rate" type="range" min="1" max="20" step="0.25" value="9"></label><label>Thời hạn: <span id="yearsVal"></span> năm<br><input id="years" type="range" min="1" max="30" step="1" value="20"></label></div><div class="row" style="gap:16px;flex-wrap:wrap;margin:12px 0"><div>Trả góp đều<br><strong class="stat" id="annuityInterest"></strong><span class="muted"> tổng lãi</span></div><div>Dư nợ giảm dần<br><strong class="stat" id="decliningInterest"></strong><span class="muted"> tổng lãi</span></div></div><svg id="chart" viewBox="0 0 640 330" role="img" aria-label="Biểu đồ dư nợ và tiền trả hàng tháng theo thời gian, so sánh hai phương thức vay" style="width:100%;display:block"></svg><div class="muted" style="font-size:12px">Nét liền: dư nợ · nét đứt: tiền trả/tháng · xanh: trả góp đều · cam: dư nợ giảm dần</div></div><script>(()=>{const P=500000000,N0=240,svg=document.getElementById('chart'),rate=document.getElementById('rate'),years=document.getElementById('years');function fmt(x,d=0){return synabit.number(x,d)}function calc(){const annual=+rate.value/100,n=+years.value*12,r=annual/12;let balA=P,balD=P,sumA=0,sumD=0;const a=[];const payA=r===0?P/n:P*r/(1-Math.pow(1+r,-n));for(let m=1;m<=n;m++){let ia=balA*r,pa=Math.min(payA,balA+ia);balA=Math.max(0,balA+ia-pa);sumA+=pa- (m===n?0:0);let id=balD*r,principal=P/n,pd=Math.min(balD+id,principal+id);balD=Math.max(0,balD-principal);sumD+=id+principal;a.push({m,ba:balA,bd:balD,pa,pd});}const totalPrincipal=P;document.getElementById('rateVal').textContent=fmt(+rate.value,2);document.getElementById('yearsVal').textContent=fmt(+years.value,0);document.getElementById('annuityInterest').textContent=fmt(sumA-totalPrincipal,0)+' ₫';document.getElementById('decliningInterest').textContent=fmt(sumD-totalPrincipal,0)+' ₫';synabit.report({annuityInterest:sumA-totalPrincipal,decliningInterest:sumD-totalPrincipal});draw(a,n);}
function draw(data,n){const W=640,H=330,L=58,R=12,T=18,B=38,pw=W-L-R,ph=H-T-B,max=Math.max(P,...data.map(x=>x.pa),...data.map(x=>x.pd));const x=i=>L+pw*i/n,y=v=>T+ph*(1-v/max);let s='';for(let j=0;j<=4;j++){const val=max*j/4,yy=y(val);s+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="var(--grid)"/><text x="${L-7}" y="${yy+4}" text-anchor="end" fill="var(--muted)" font-size="10">${fmt(val/1e6,0)}M</text>`;}for(let j=0;j<=4;j++){const i=Math.round(n*j/4),xx=x(i);s+=`<text x="${xx}" y="${H-12}" text-anchor="middle" fill="var(--muted)" font-size="10">${fmt(i/12,0)}y</text>`;}function path(key){return data.map((d,i)=>`${i?'L':'M'}${x(d.m)},${y(d[key])}`).join(' ')}s+=`<path d="${path('ba')}" fill="none" stroke="var(--c1)" stroke-width="2.5"/><path d="${path('bd')}" fill="none" stroke="var(--c2)" stroke-width="2.5"/><path d="${path('pa')}" fill="none" stroke="var(--c1)" stroke-width="2" stroke-dasharray="5 4"/><path d="${path('pd')}" fill="none" stroke="var(--c2)" stroke-width="2" stroke-dasharray="5 4"/><text x="${L}" y="12" fill="var(--muted)" font-size="10">₫</text>`;svg.innerHTML=s;}rate.addEventListener('input',calc);years.addEventListener('input',calc);calc();})();</script>
