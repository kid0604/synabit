     Nothing the lint can see is wrong with it. Not a claim that it is a good visual. -->
<div>
<div class="row" style="align-items:center;gap:16px;flex-wrap:wrap">
<label>N <input id="n" type="range" min="10" max="500" step="10" value="50"> <span id="nv"></span></label>
<label>p₀ <input id="p" type="range" min="0.05" max="0.95" step="0.05" value="0.5"> <span id="pv"></span></label>
<button id="run">Chạy</button><button id="reset">Đặt lại</button>
</div>
<svg id="plot" viewBox="0 0 640 330" role="img" aria-label="Hai mươi quần thể Wright–Fisher qua 200 thế hệ, so sánh kích thước quần thể nhỏ và lớn"></svg>
<div class="row" style="gap:16px;flex-wrap:wrap"><span class="muted">Đường mảnh: từng quần thể • Đường đậm: trung bình</span><span id="fix" class="stat"></span></div>
<script>
(()=>{
const svg=document.getElementById('plot'), ns='http://www.w3.org/2000/svg';
const N=document.getElementById('n'), P=document.getElementById('p');
let paths=[];
function el(tag,attrs={}){const e=document.createElementNS(ns,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e}
function simulate(n,p0){let runs=[];for(let r=0;r<20;r++){let p=p0,a=[p];for(let t=0;t<200;t++){let k=0;for(let i=0;i<2*n;i++)if(Math.random()<p)k++;p=k/(2*n);a.push(p)}runs.push(a)}return runs}
function draw(){let n=+N.value,p0=+P.value;document.getElementById('nv').textContent=synabit.number(n,0);document.getElementById('pv').textContent=synabit.number(p0,2);let runs=simulate(n,p0);svg.replaceChildren();let W=640,H=330,L=48,R=12,T=12,B=36,x=t=>L+t/200*(W-L-R),y=p=>T+(1-p)*(H-T-B);
for(let i=0;i<=4;i++){let v=i/4;svg.append(el('line',{x1:L,y1:y(v),x2:W-R,y2:y(v),stroke:'var(--grid)'}));let tx=el('text',{x:L-8,y:y(v)+4,'text-anchor':'end',fill:'var(--muted)','font-size':11});tx.textContent=synabit.number(v,2);svg.append(tx)}
for(let i=0;i<=4;i++){let t=i*50;let tx=el('text',{x:x(t),y:H-10,'text-anchor':'middle',fill:'var(--muted)','font-size':11});tx.textContent=synabit.number(t,0);svg.append(tx)}
let fixed=0;for(let r=0;r<20;r++){if(runs[r][200]===0||runs[r][200]===1)fixed++;let d=runs[r].map((v,t)=>(t?'L':'M')+x(t)+','+y(v)).join(' ');svg.append(el('path',{d,fill:'none',stroke:'var(--c1)',opacity:.32,'stroke-width':1}))}
let mean=Array.from({length:201},(_,t)=>runs.reduce((s,a)=>s+a[t],0)/20);svg.append(el('path',{d:mean.map((v,t)=>(t?'L':'M')+x(t)+','+y(v)).join(' '),fill:'none',stroke:'var(--c2)','stroke-width':3}));
let p0line=el('line',{x1:L,y1:y(p0),x2:W-R,y2:y(p0),stroke:'var(--muted)','stroke-dasharray':'4 4'});svg.append(p0line);
document.getElementById('fix').textContent='Đã cố định sau 200 thế hệ: '+synabit.number(fixed,0)+'/20';}
N.addEventListener('input',draw);P.addEventListener('input',draw);document.getElementById('run').addEventListener('click',draw);document.getElementById('reset').addEventListener('click',draw);draw();
})();
</script>
</div>
