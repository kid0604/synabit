<!-- The step-buttons schedule of the visual-quality baseline (see clean-loan-schedule.html), checked
     against a brief that names "tổng tiền lãi", which it never reports. Changed from the original:
     nothing; the fault is in the brief it is checked against (cases.json). -->
<div style="max-width:640px;width:100%;color:var(--text);font:inherit"><div class="row" style="align-items:center;gap:12px;flex-wrap:wrap"><button id="prev">Tháng trước</button><input id="month" type="range" min="1" max="12" step="1" value="1" style="flex:1;min-width:150px"><button id="next">Tháng sau</button></div><div class="row" style="gap:12px;flex-wrap:wrap;margin:12px 0"><div class="stat">Tháng <span id="m">1</span>/12</div><div>Gốc trả<strong id="p"></strong></div><div>Lãi<strong id="i"></strong></div><div>Dư nợ sau trả<strong id="b"></strong></div></div><svg id="chart" viewBox="0 0 640 190" role="img" aria-label="Biểu đồ dư nợ giảm dần qua 12 tháng" style="width:100%;height:auto"></svg></div><script>const rows=[{month:1,principal:10000000,interest:1200000,balance:110000000},{month:2,principal:10000000,interest:1100000,balance:100000000},{month:3,principal:10000000,interest:1000000,balance:90000000},{month:4,principal:10000000,interest:900000,balance:80000000},{month:5,principal:10000000,interest:800000,balance:70000000},{month:6,principal:10000000,interest:700000,balance:60000000},{month:7,principal:10000000,interest:600000,balance:50000000},{month:8,principal:10000000,interest:500000,balance:40000000},{month:9,principal:10000000,interest:400000,balance:30000000},{month:10,principal:10000000,interest:300000,balance:20000000},{month:11,principal:10000000,interest:200000,balance:10000000},{month:12,principal:10000000,interest:100000,balance:0}];const slider=document.getElementById('month');function fmt(n){return synabit.number(n/1000000,1)+' triệu ₫'}function draw(){const k=+slider.value,r=rows[k-1];document.getElementById('m').textContent=k;document.getElementById('p').textContent=' '+fmt(r.principal);document.getElementById('i').textContent=' '+fmt(r.interest);document.getElementById('b').textContent=' '+fmt(r.balance);const svg=document.getElementById('chart');svg.replaceChildren();const ns='http://www.w3.org/2000/svg';function el(tag,attrs,text){const e=document.createElementNS(ns,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text)e.textContent=text;svg.appendChild(e);return e}const left=48,right=620,top=12,bottom=158;[0,30,60,90,120].forEach(v=>{let y=bottom-v/120*(bottom-top);el('line',{x1:left,y1:y,x2:right,y2:y,stroke:'var(--grid)'});el('text',{x:left-8,y:y+4,'text-anchor':'end',fill:'var(--muted)','font-size':11},String(v))});el('text',{x:left,y:185,fill:'var(--muted)','font-size':11},'Dư nợ (triệu ₫)');rows.forEach((d,j)=>{let x=left+(j+.5)*(right-left)/12;let h=d.balance/120000000*(bottom-top);el('rect',{x:x-12,y:bottom-h,width:24,height:h,fill:j+1===k?'var(--accent)':'var(--c1)',opacity:j+1===k?'1':'0.65'});el('text',{x,y:174,'text-anchor':'middle',fill:'var(--muted)','font-size':10},String(j+1))})}slider.addEventListener('input',draw);document.getElementById('prev').addEventListener('click',()=>{slider.value=Math.max(1,+slider.value-1);draw()});document.getElementById('next').addEventListener('click',()=>{slider.value=Math.min(12,+slider.value+1);draw()});draw();</script>
