<!-- SynVisuals/5d4b638a98584c7c94b9a6dd7bffa510.md, "Bayes: xác suất mắc bệnh sau xét nghiệm dương tính", gpt-6-luna, 2026-10-28.
     Bars filled with synabit.color() written into the SVG: they keep their colour when the theme changes. -->
<div style="width:100%;max-width:640px;color:var(--text)">
<div class="row" style="gap:16px;flex-wrap:wrap;align-items:center">
<label>Tỷ lệ mắc: <span id="pv"></span>%<br><input id="p" type="range" min="0.1" max="50" step="0.1" value="1"></label>
<label>Độ nhạy: <span id="sv"></span>%<br><input id="s" type="range" min="50" max="100" step="1" value="99"></label>
<label>Độ đặc hiệu: <span id="cv"></span>%<br><input id="c" type="range" min="50" max="100" step="1" value="95"></label>
</div>
<div id="result" class="stat" style="margin:12px 0"></div>
<svg id="plot" viewBox="0 0 640 300" role="img" aria-label="So sánh số người dương tính thật và dương tính giả trên 10.000 người" style="width:100%;height:auto;display:block"></svg>
<div class="row" style="gap:16px;flex-wrap:wrap;margin-top:8px"><span style="color:var(--c1)">■ Dương tính thật</span><span style="color:var(--c2)">■ Dương tính giả</span></div>
</div>
<script>(()=>{const p=document.getElementById('p'),s=document.getElementById('s'),c=document.getElementById('c'),pv=document.getElementById('pv'),sv=document.getElementById('sv'),cv=document.getElementById('cv'),result=document.getElementById('result'),svg=document.getElementById('plot');function draw(){const P=+p.value/100,S=+s.value/100,C=+c.value/100;pv.textContent=synabit.number(+p.value,1);sv.textContent=synabit.number(+s.value,0);cv.textContent=synabit.number(+c.value,0);const tp=10000*P*S,fp=10000*(1-P)*(1-C),ppv=tp/(tp+fp);result.textContent='Xác suất mắc sau dương tính: '+synabit.number(ppv*100,2)+'%';const max=Math.max(tp,fp,1),scale=440/max;const bar=(y,label,val,color)=>`<text x="12" y="${y+18}" fill="var(--text)" font-size="14">${label}</text><rect x="150" y="${y}" width="${Math.max(1,val*scale)}" height="28" fill="${color}"/><text x="${Math.min(610,158+val*scale)}" y="${y+19}" fill="var(--text)" font-size="14">${synabit.number(val,0)}</text>`;svg.innerHTML=`<text x="150" y="22" fill="var(--muted)" font-size="13">Số người trên 10.000 người được xét nghiệm</text>${bar(55,'Dương tính thật',tp,synabit.color('c1'))}${bar(115,'Dương tính giả',fp,synabit.color('c2'))}<text x="12" y="190" fill="var(--text)" font-size="14">Trong tất cả kết quả dương tính, phần thật sự mắc bệnh</text><rect x="12" y="210" width="600" height="34" rx="4" fill="var(--surface-alt)"/><rect x="12" y="210" width="${600*ppv}" height="34" rx="4" fill="${synabit.color('c1')}"/><text x="12" y="275" fill="var(--muted)" font-size="13">Thanh dưới: phần dương tính thật trong tổng dương tính</text>`}for(const el of [p,s,c])el.addEventListener('input',draw);draw()})()</script>
