<!-- SynVisuals/c58bdcbaf59a4fb7889bfe7c07b8d45e.md, "Tác động của thuế đơn vị lên thị trường", gpt-6-luna, 2026-10-28.
     The buyer's price after tax derived as (t + 120)/5, dropping the 3 in 5P = 120 + 3t. Substituted back, demand and supply do not meet.
     Changed from the original: the one `synabit.expect` the plan's rule (§2.2) asks for, substituting the derived prices back into the given curves. -->
<div style="max-width:640px;color:var(--text)"><div class="row" style="gap:14px;align-items:center;flex-wrap:wrap"><label>Thuế: <span id="tv"></span> nghìn đồng/đv<br><input id="tax" type="range" min="0" max="20" step="0.5" value="2"></label></div><div class="row" style="gap:12px;flex-wrap:wrap;margin:10px 0"><div>Người mua chịu<br><strong class="stat" id="buyer"></strong></div><div>Người bán chịu<br><strong class="stat" id="seller"></strong></div><div>Thu ngân sách<br><strong class="stat" id="revenue"></strong></div><div>Mất mát xã hội<br><strong class="stat" id="dwl"></strong></div></div><svg id="chart" viewBox="0 0 640 300" role="img" aria-label="Đường cầu và cung trước, sau thuế; trục dọc là giá nghìn đồng, trục ngang là sản lượng"><g id="plot"></g></svg><div class="muted">Đường cầu · cung ban đầu · cung sau thuế</div></div><script>(()=>{const tax=document.getElementById('tax'),tv=document.getElementById('tv'),buyer=document.getElementById('buyer'),seller=document.getElementById('seller'),revenue=document.getElementById('revenue'),dwl=document.getElementById('dwl'),g=document.getElementById('plot');const fmt=(x,d=2)=>synabit.number(x,d);function draw(){const t=+tax.value,pc=(t+120)/5,ps=pc-t,q=100-2*pc,b=pc-24,s=24-ps,r=t*q,l=.5*t*(52-q);synabit.expect("demand meets supply after the tax",100-2*pc,3*ps-20,1e-6);tv.textContent=fmt(t);buyer.textContent=fmt(b)+' nghìn/đv';seller.textContent=fmt(s)+' nghìn/đv';revenue.textContent=fmt(r)+' nghìn';dwl.textContent=fmt(l)+' nghìn';const W=640,H=300,L=52,R=12,T=12,B=38,pw=W-L-R,ph=H-T-B;const X=q=>L+q/100*pw,Y=p=>T+(50-p)/50*ph;let a=[];function line(points,color,dash=''){a.push(`<polyline points="${points.map(v=>X(v[0])+','+Y(v[1])).join(' ')}" fill="none" stroke="${color}" stroke-width="2.5" ${dash?`stroke-dasharray="${dash}"`:''}/>`)}for(let i=0;i<=5;i++){let p=i*10,y=Y(p);a.push(`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="var(--grid)"/><text x="${L-8}" y="${y+4}" text-anchor="end" fill="var(--muted)" font-size="11">${fmt(p,0)}</text>`)}for(let i=0;i<=5;i++){let qv=i*20,x=X(qv);a.push(`<line x1="${x}" y1="${T}" x2="${x}" y2="${H-B}" stroke="var(--grid)"/><text x="${x}" y="${H-12}" text-anchor="middle" fill="var(--muted)" font-size="11">${fmt(qv,0)}</text>`)}line([[0,50],[100,0]],'var(--c1)');line([[20/3,0],[70,50]],'var(--c2)');line([[20/3,0],[70,50]].map(v=>[v[0],v[1]+t]),'var(--c3)','6 4');a.push(`<circle cx="${X(q)}" cy="${Y(pc)}" r="4" fill="var(--c1)"/><circle cx="${X(q)}" cy="${Y(ps)}" r="4" fill="var(--c2)"/><text x="${W/2}" y="${H-1}" text-anchor="middle" fill="var(--text-2)" font-size="11">Sản lượng</text><text x="12" y="${H/2}" transform="rotate(-90 12 ${H/2})" text-anchor="middle" fill="var(--text-2)" font-size="11">Giá (nghìn đồng)</text>`);g.innerHTML=a.join('')}tax.addEventListener('input',draw);draw()})()</script>
