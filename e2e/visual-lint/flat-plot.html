<!-- kept by SYN_EVAL_KEEP from `tests::ask` on gpt-6-luna, 2026-10-28 (the loan question, second visual of the third ask).

<div style="max-width:640px;color:var(--text)"><div class="row" style="display:flex;gap:14px;flex-wrap:wrap"><label>Số tiền vay: <b id="principalLabel"></b><br><input id="principal" type="range" min="50000000" max="2000000000" step="10000000" value="500000000" style="width:240px"></label><label>Lãi suất: <b id="rateLabel"></b><br><input id="rate" type="range" min="0" max="20" step="0.1" value="9" style="width:180px"></label><label>Thời hạn: <b id="termLabel"></b><br><input id="term" type="range" min="1" max="30" step="1" value="20" style="width:150px"></label></div><div class="row" style="display:flex;gap:12px;flex-wrap:wrap;margin:12px 0"><div class="stat">Trả góp đều<br><span id="equalPay"></span><div class="muted">Lãi tổng: <span id="equalInt"></span></div></div><div class="stat">Dư nợ giảm dần<br><span id="declFirst"></span><div class="muted">Lãi tổng: <span id="declInt"></span></div></div></div><div style="font-weight:600;margin:10px 0 3px">Dư nợ (triệu ₫)</div><svg id="balance" role="img" aria-label="Dư nợ theo tháng" style="width:100%;height:220px"></svg><div style="font-weight:600;margin:10px 0 3px">Tiền trả mỗi tháng (triệu ₫)</div><svg id="payments" role="img" aria-label="Tiền trả mỗi tháng" style="width:100%;height:220px"></svg></div><script src="/lib/d3.v7.min.js"></script><script>const fmt=x=>synabit.number(x,0)+' ₫'; function calc(){const P=+document.getElementById('principal').value, annual=+document.getElementById('rate').value/100,n=+document.getElementById('term').value*12,r=annual/12;let balE=P,balD=P,be=[P],bd=[P],pe=[],pd=[],ie=0,id=0;let eq=r===0?P/n:P*r/(1-Math.pow(1+r,-n));for(let i=0;i<n;i++){let intE=balE*r, payE=Math.min(eq,balE+intE);balE=Math.max(0,balE+intE-payE);ie+=intE;pe.push(payE);be.push(balE);let intD=balD*r, payD=P/n+intD;balD=Math.max(0,balD-P/n);id+=intD;pd.push(payD);bd.push(balD)}document.getElementById('principalLabel').textContent=fmt(P);document.getElementById('rateLabel').textContent=annual*100+'%';document.getElementById('termLabel').textContent=document.getElementById('term').value+' năm';document.getElementById('equalPay').textContent=fmt(eq)+'/tháng';document.getElementById('equalInt').textContent=fmt(ie);document.getElementById('declFirst').textContent=fmt(pd[0])+' → '+fmt(pd[pd.length-1])+'/tháng';document.getElementById('declInt').textContent=fmt(id);draw('#balance',[{name:'Trả góp đều',v:be},{name:'Dư nợ giảm dần',v:bd}],n);draw('#payments',[{name:'Trả góp đều',v:pe},{name:'Dư nợ giảm dần',v:pd}],n)}function draw(sel,series,n){const svg=d3.select(sel),w=640,h=220,m={t:10,r:12,b:32,l:58};svg.selectAll('*').remove();svg.attr('viewBox',`0 0 ${w} ${h}`);const x=d3.scaleLinear().domain([0,n]).range([m.l,w-m.r]),y=d3.scaleLinear().domain([0,d3.max(series,s=>d3.max(s.v))||1]).nice().range([h-m.b,m.t]);svg.append('g').attr('transform',`translate(0,${h-m.b})`).call(d3.axisBottom(x).ticks(6));svg.append('g').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(y).ticks(5).tickFormat(d=>synabit.number(d,0)));const line=d3.line().x((d,i)=>x(i+(sel==='#balance'?0:1))).y(d=>y(d/(sel==='#balance'?1000000:1000000)));series.forEach((s,j)=>svg.append('path').datum(s.v).attr('fill','none').attr('stroke',j?'var(--c2)':'var(--c1)').attr('stroke-width',2).attr('d',line))}['principal','rate','term'].forEach(id=>document.getElementById(id).addEventListener('input',calc));calc();</script>
