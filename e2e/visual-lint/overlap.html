<!-- SynVisuals/7651ceadb0db422c94433cf637d1b7a8.md, "Gánh nặng thuế đơn vị", gpt-6.1-terra, 2026-10-28.
     The labels "Cung" and "Cầu" sit on the lines they name, which run through them. -->
<div class="row"><label for="tax">Thuế mỗi đơn vị: <strong id="tv"></strong> nghìn đồng</label><input id="tax" type="range" min="0" max="30" step="0.1" value="2" aria-label="Mức thuế mỗi đơn vị"></div><svg id="plot" viewBox="0 0 640 360" width="100%" role="img" aria-label="Cung cầu, doanh thu thuế và mất mát xã hội"></svg><div id="stats" class="row" style="display:flex;flex-wrap:wrap;gap:12px"></div><div class="muted" style="font-size:12px;margin-top:8px">Qd = 100 − 2Pc; Qs = 3Ps − 20; Pc − Ps = thuế. Giả sử thị trường cạnh tranh, lượng giao dịch không âm.</div><script>const svg=document.getElementById('plot'),slider=document.getElementById('tax'),tv=document.getElementById('tv'),stats=document.getElementById('stats');const f=(x,d=1)=>synabit.number(x,d);function draw(){let t=+slider.value,p0=24,q0=52,pc=(120+3*t)/5,ps=pc-t,q=100-2*pc;let X=x=>65+x*5.1,Y=y=>310-y*5.5;let line=(x1,y1,x2,y2,c,d='')=>`<line x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}" stroke="${c}" stroke-width="2" ${d?'stroke-dasharray="5 4"':''}/>`;let poly=(pts,fill,opacity)=>`<polygon points="${pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}" fill="${fill}" opacity="${opacity}"/>`;let a=[];for(let i=0;i<=100;i+=20){a.push(line(i,0,i,50,'var(--grid)'));a.push(`<text x="${X(i)}" y="330" text-anchor="middle" fill="var(--muted)" font-size="11">${f(i,0)}</text>`)}for(let i=0;i<=50;i+=10){a.push(line(0,i,100,i,'var(--grid)'));a.push(`<text x="55" y="${Y(i)+4}" text-anchor="end" fill="var(--muted)" font-size="11">${f(i,0)}</text>`)}a.push(poly([[0,ps],[q,ps],[q,pc],[0,pc]],'var(--c1)',0.22));a.push(poly([[q,ps],[q,pc],[q0,p0]],'var(--danger)',0.45));a.push(line(0,50,100,0,'var(--c1)'));a.push(line(0,20/3,100,40,'var(--c2)'));a.push(line(0,20/3+t,Math.min(100,130-3*t),Math.min(50,40+t),'var(--c2)',true));a.push(line(q,0,q,pc,'var(--muted)',true));a.push(line(0,pc,q,pc,'var(--muted)',true));a.push(line(0,ps,q,ps,'var(--muted)',true));a.push(`<circle cx="${X(q)}" cy="${Y(pc)}" r="4" fill="var(--c1)"/><circle cx="${X(q)}" cy="${Y(ps)}" r="4" fill="var(--c2)"/><circle cx="${X(q0)}" cy="${Y(p0)}" r="3" fill="var(--text)"/>`);a.push(`<text x="320" y="355" text-anchor="middle" fill="var(--text)" font-size="12">Sản lượng Q</text><text x="14" y="175" transform="rotate(-90 14 175)" text-anchor="middle" fill="var(--text)" font-size="12">Giá P (nghìn đồng)</text><text x="${X(78)}" y="${Y(11)}" fill="var(--c1)" font-size="12">Cầu</text><text x="${X(78)}" y="${Y(34)}" fill="var(--c2)" font-size="12">Cung</text>`);svg.innerHTML=a.join('');tv.textContent=f(t);stats.innerHTML=`<span>Giá mua: <b>${f(pc)}</b></span><span>Giá bán: <b>${f(ps)}</b></span><span>Lượng: <b>${f(q)}</b></span><span>Người mua: <b>${f(pc-p0,2)}/đv</b></span><span>Người bán: <b>${f(p0-ps,2)}/đv</b></span><span>Thuế thu: <b>${f(t*q,2)}</b></span><span>Mất mát: <b>${f(0.5*t*(q0-q),2)}</b></span><span style="color:var(--c1)">■ Thu ngân sách</span><span style="color:var(--danger)">■ Mất mát xã hội</span>`}synabit.ready.then(draw);slider.addEventListener('input',draw);synabit.onContext(draw);</script>
