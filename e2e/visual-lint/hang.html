</style><div class="dij"><div class="row"><button id="prev">Lùi lại</button><button id="next">Bước tiếp</button><span id="stepLabel" class="muted"></span></div><svg id="graph" viewBox="0 0 560 250" role="img" aria-label="Đồ thị vô hướng có trọng số, trạng thái Dijkstra từ A"></svg><div id="summary" class="stat"></div><table><thead><tr><th>Nút</th><th>Khoảng cách</th><th>Trước đó</th><th>Trạng thái</th></tr></thead><tbody id="rows"></tbody></table></div><script>
(()=>{const nodes=['A','B','C','D','E','F','G'];const edges=[['A','B',4],['A','C',2],['C','B',1],['B','D',5],['C','D',8],['C','E',10],['D','E',2],['D','F',6],['E','F',3],['E','G',1],['F','G',4]];const pos={A:[55,125],B:[165,60],C:[165,190],D:[290,60],E:[390,150],F:[500,70],G:[500,210]};let states=[];let dist,prev,done;function snap(label,current,active){states.push({label,current,active,dist:{...dist},prev:{...prev},done:[...done]})}function build(){states=[];dist=Object.fromEntries(nodes.map(n=>[n,Infinity]));prev=Object.fromEntries(nodes.map(n=>[n,'—']));done=[];dist.A=0;snap('Khởi tạo',null,[]);let unvisited=[...nodes];while(unvisited.length){let u=unvisited.filter(n=>!done.includes(n)).sort((a,b)=>dist[a]-dist[b])[0];if(dist[u]===Infinity)break;done.push(u);snap('Chọn '+u+' (d='+dist[u]+')',u,[]);for(let i=0;i<edges.length;i++){let [a,b,w]=edges[i];let v=a===u?b:b===u?a:null;if(v===null||done.includes(v))continue;let cand=dist[u]+w;if(cand<dist[v]){dist[v]=cand;prev[v]=u;snap('Nới lỏng '+u+'–'+v+': '+cand,u,[i]);}}}snap('Hoàn tất',null,[])}let idx=0;const svg=document.getElementById('graph');function render(){const s=states[idx];document.getElementById('stepLabel').textContent=`Bước ${idx} / ${states.length-1}`;document.getElementById('summary').textContent=s.label;svg.innerHTML='';for(let i=0;i<edges.length;i++){let [a,b,w]=edges[i],p=pos[a],q=pos[b],line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',p[0]);line.setAttribute('y1',p[1]);line.setAttribute('x2',q[0]);line.setAttribute('y2',q[1]);line.setAttribute('class','edge '+(s.active.includes(i)?'active':''));svg.appendChild(line);let t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',(p[0]+q[0])/2);t.setAttribute('y',(p[1]+q[1])/2-7);t.setAttribute('text-anchor','middle');t.setAttribute('class','weight');t.textContent=w;svg.appendChild(t)}for(let n of nodes){let [x,y]=pos[n],c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',19);c.setAttribute('class','node '+(s.done.includes(n)?'done ':'')+(s.current===n?'current':''));svg.appendChild(c);let t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',x);t.setAttribute('y',y+5);t.setAttribute('text-anchor','middle');t.textContent=n;svg.appendChild(t)}let body=document.getElementById('rows');body.innerHTML='';for(let n of nodes){let tr=document.createElement('tr');let vals=[n,s.dist[n]===Infinity?'∞':synabit.number(s.dist[n],0),s.prev[n],s.done.includes(n)?'קבוע':'לא סופי'];for(let v of vals){let td=document.createElement('td');td.textContent=v;tr.appendChild(td)}body.appendChild(tr)}}document.getElementById('next').onclick=()=>{idx=Math.min(idx+1,states.length-1);render()};document.getElementById('prev').onclick=()=>{idx=Math.max(0,idx-1);render()};build();render()})();</script>
