const fmt=x=>synabit.number(x,1)+' triệu ₫';
function schedule(P,rate,years){let n=years*12,r=rate/1200,a=[];let bal1=P,bal2=P;let pay1=r===0?P/n:P*r/(1-Math.pow(1+r,-n));for(let m=1;m<=n;m++){let int1=bal1*r;let principal1=pay1-int1;bal1=Math.max(0,bal1-principal1);let principal2=P/n,int2=bal2*r,pay2=principal2+int2;bal2=Math.max(0,bal2-principal2);a.push({m,b1:bal1,b2:bal2,t1:pay1,t2:pay2});}let i1=a.reduce((s,d)=>s+d.t1,0)-P,i2=a.reduce((s,d)=>s+d.t2,0)-P;return {a,i1,i2};}

</script></div>
