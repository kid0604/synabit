ument.getElementById('declInt').textContent=fmt(id);draw('#balance',[be,bd],n);draw('#payments',[pe,pd],n)}function draw(sel,series,n){const svg=d3.select(sel);svg.selectAll('*').remove();const w=640,h=220,m={t:8,r:12,b:28,l:52};svg.attr('viewBox',`0 0 ${w} ${h}`);const x=d3.scaleLinear().domain([0,n]).range([m.l,w-m.r]),max=d3.max(series.flat());const y=d3.scaleLinear().domain([0,max]).nice().range([h-m.b,m.t]);svg.append('g').attr('transform',`translate(0,${h-m.b})`).call(d3.axisBottom(x).ticks(6).tickFormat(d=>d/12+'y'));svg.append('g').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(y).ticks(5).tickFormat(d=>synabit.number(d/1e6,0)));svg.append('text').attr('x',w-m.r).attr('y',h-4).attr('text-anchor','end').attr('fill','var(--text-2)').text('Tháng');series.forEach((a,i)=>{const line=d3.line().x((d,j)=>x(j)).y(d=>y(d));svg.append('path').datum(a).attr('fill','none').attr('stroke',i?'var(--c2)':'var(--c1)').attr('stroke-width',2).attr('d',line)});svg.append('text').attr('x',m.l+4).attr('y',m.t+12).attr('fill','var(--c1)').text('Trả góp đều');svg.append('text').attr('x',m.l+100).attr('y',m.t+12).attr('fill','var(--c2)').text('Dư nợ giảm dần')}document.getElementById('rate').addEventListener('input',calc);document.getElementById('term').addEventListener('input',calc);synabit.ready.then(calc);</script>
