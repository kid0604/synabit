<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Utilities — mockup UI/UX, 2026-11-11</title>
<!--
  Mockup bấm được cho app Utilities của Synabit. Không phải code của app:
  một file, không phụ thuộc gì, mở thẳng trong trình duyệt. Màu, cỡ chữ, nút
  lấy theo src/style.css và AppHeader.vue để trông như app thật.
  Thiết kế: docs/utilities-2026-11-11.md, §9.
-->
<style>
:root{
  --base:#fdfdfc;--surface:#fff;--surface-alt:#fbfbfc;--hover:#f5f5f5;--border:#e6e6e6;--border-subtle:#e0e0e0;
  --muted:#6b6b6b;--text:#1c1c1e;--text2:#52525b;--text3:#71717a;--accent:#1a66cc;--accent-text:#1a66cc;
  --danger:#ef4444;--success:#16a34a;--warning:#b45309;--warning-bg:#fef3c7;
  --c-pdf:#d93838;--c-conv:#1a66cc;--c-img:#7c3aed;--c-media:#c2410c;
  --page:#fff;--page-line:#e4e4e7;--radius:8px;
}
.dark{
  --base:#242424;--surface:#1e1e1e;--surface-alt:#191919;--hover:#2a2a2a;--border:#2c2c2c;--border-subtle:#3a3a3a;
  --muted:#a1a1aa;--text:#f4f4f5;--text2:#a1a1aa;--text3:#909098;--accent-text:#3fc3e0;
  --warning:#fbbf24;--warning-bg:#3a2e12;--success:#4ade80;
  --c-pdf:#f87171;--c-conv:#60a5fa;--c-img:#a78bfa;--c-media:#fb923c;
  --page:#f4f4f5;--page-line:#d4d4d8;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--base);color:var(--text);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
input,select{font:inherit;color:var(--text)}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
svg.i.lg{width:20px;height:20px}
svg.i.xl{width:28px;height:28px}
.shell{display:flex;height:100vh}
/* the app switcher rail */
.rail{width:52px;border-right:1px solid var(--border);background:var(--surface-alt);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px}
.rail button{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--text3)}
.rail button:hover{background:var(--hover)}
.rail button.on{background:color-mix(in oklab,var(--accent) 14%,transparent);color:var(--accent-text)}
.rail .sp{flex:1}
/* the app's own sidebar */
.side{width:256px;border-right:1px solid var(--border);background:var(--surface-alt);display:flex;flex-direction:column;overflow:auto}
.side .top{padding:12px 12px 8px;display:flex;align-items:center;gap:8px}
.side .badge{width:28px;height:28px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center}
.side h2{font-size:15px;margin:0;font-weight:600}
.search{display:flex;align-items:center;gap:8px;margin:4px 12px 8px;padding:0 10px;height:34px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text3)}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0}
.search kbd{font-size:11px;border:1px solid var(--border);border-radius:4px;padding:0 5px;color:var(--text3)}
.sec{padding:10px 12px 2px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);display:flex;justify-content:space-between;align-items:center}
.nav{display:flex;align-items:center;gap:9px;margin:1px 8px;padding:6px 8px;border-radius:7px;color:var(--text2);text-align:left;width:calc(100% - 16px)}
.nav:hover{background:var(--hover)}
.nav.on{background:color-mix(in oklab,var(--accent) 12%,transparent);color:var(--accent-text);font-weight:500}
.nav .n{margin-left:auto;font-size:12px;color:var(--text3)}
.nav .sub{display:block;font-size:11.5px;color:var(--text3)}
.dot{width:8px;height:8px;border-radius:3px;flex-shrink:0}
.side .foot{margin-top:auto;padding:12px;font-size:12px;color:var(--text3);display:flex;gap:8px;line-height:1.4}
/* main column */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 24px;border-bottom:1px solid var(--border);background:var(--base)}
header .navb{display:flex;gap:2px;color:var(--text3)}
header .navb button{width:28px;height:28px;border-radius:6px;display:grid;place-items:center}
header .navb button:hover{background:var(--hover)}
header .title{display:flex;align-items:center;gap:8px;min-width:0}
header h1{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:0;white-space:nowrap}
header .subt{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .acts{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:var(--radius);font-size:14px;font-weight:500;white-space:nowrap}
.btn.p{background:var(--accent);color:#fff}
.btn.p:hover{background:color-mix(in oklab,var(--accent) 88%,black)}
.btn.p:disabled{opacity:.45}
.btn.s{border:1px solid var(--border);background:var(--surface)}
.btn.s:hover{background:var(--hover)}
.btn.g{color:var(--text2)}
.btn.g:hover{background:var(--hover)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.ib{width:32px;height:32px;border-radius:7px;display:grid;place-items:center;color:var(--text3)}
.ib:hover{background:var(--hover);color:var(--text)}
.body{flex:1;overflow:auto;position:relative}
/* home */
.home{padding:20px 28px 40px;max-width:1180px}
.dropbar{display:flex;align-items:center;gap:14px;border:1.5px dashed var(--border-subtle);border-radius:12px;padding:14px 18px;color:var(--text2);background:var(--surface)}
.dropbar b{color:var(--text);font-weight:600}
.dropbar .btn{margin-left:auto}
.grp{margin-top:26px}
.grp h3{font-size:13px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.grp h3 small{font-weight:400;color:var(--text3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px}
.card{position:relative;display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);transition:border-color .12s,box-shadow .12s}
.card:hover{border-color:var(--border-subtle);box-shadow:0 1px 3px rgb(0 0 0/.06)}
.card .ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
.card .nm{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.card .ds{font-size:12.5px;color:var(--text2);margin-top:2px;line-height:1.35}
.card .pin{position:absolute;top:8px;right:8px;opacity:0;color:var(--text3)}
.card:hover .pin,.card .pin.on{opacity:1}
.card .pin.on{color:#eab308}
.card .pin.on svg{fill:#eab308}
.card.off{opacity:.55}
.tag{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:999px;white-space:nowrap}
.tag.t-setup{background:var(--warning-bg);color:var(--warning)}
.tag.t-na{background:var(--hover);color:var(--text3)}
.ic.pdf{background:color-mix(in oklab,var(--c-pdf) 13%,transparent);color:var(--c-pdf)}
.ic.conv{background:color-mix(in oklab,var(--c-conv) 13%,transparent);color:var(--c-conv)}
.ic.img{background:color-mix(in oklab,var(--c-img) 13%,transparent);color:var(--c-img)}
.ic.media{background:color-mix(in oklab,var(--c-media) 13%,transparent);color:var(--c-media)}
.empty-search{padding:40px;text-align:center;color:var(--text2)}
/* tool screen */
.tool{display:flex;height:100%}
.work{flex:1;overflow:auto;padding:22px 26px;min-width:0;position:relative}
.opts{width:316px;border-left:1px solid var(--border);background:var(--surface-alt);overflow:auto;display:flex;flex-direction:column}
.opts .o{padding:16px 18px;border-bottom:1px solid var(--border)}
.opts h4{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.opts label.row{display:flex;align-items:center;gap:8px;margin:8px 0;color:var(--text2)}
.opts .field{width:100%;height:34px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:0 10px;outline:none}
.opts .field:focus{border-color:var(--accent)}
.opts .hint{font-size:12px;color:var(--text3);margin-top:6px;line-height:1.4}
.seg{display:flex;background:var(--hover);border-radius:8px;padding:3px;gap:2px}
.seg button{flex:1;height:28px;border-radius:6px;font-size:13px;color:var(--text2)}
.seg button.on{background:var(--surface);color:var(--text);font-weight:500;box-shadow:0 1px 2px rgb(0 0 0/.08)}
.range{display:flex;align-items:center;gap:10px}
.range input{flex:1;accent-color:var(--accent)}
.range span{width:42px;text-align:right;font-variant-numeric:tabular-nums;color:var(--text2);font-size:13px}
.pos{display:grid;grid-template-columns:repeat(3,28px);gap:4px}
.pos button{height:28px;border:1px solid var(--border);border-radius:6px;background:var(--surface)}
.pos button.on{background:var(--accent);border-color:var(--accent)}
.levels{display:flex;flex-direction:column;gap:8px}
.level{border:1px solid var(--border);border-radius:9px;padding:10px 12px;text-align:left;background:var(--surface)}
.level.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.level b{display:flex;justify-content:space-between;font-weight:600}
.level b small{font-weight:500;color:var(--success)}
.level p{margin:3px 0 0;font-size:12.5px;color:var(--text2)}
.out{margin-top:auto}
/* drop zone, first state of a tool */
.dz{height:100%;min-height:380px;border:2px dashed var(--border-subtle);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:var(--surface);padding:24px}
.dz.hot{border-color:var(--accent);background:color-mix(in oklab,var(--accent) 6%,var(--surface))}
.dz .big{width:64px;height:64px;border-radius:16px;display:grid;place-items:center}
.dz .big svg.i{width:30px;height:30px}
.dz h2{margin:6px 0 0;font-size:18px}
.dz p{margin:0;color:var(--text2)}
.dz .row{display:flex;gap:8px;margin-top:8px}
.dz .fine{font-size:12px;color:var(--text3);margin-top:6px}
/* files in a tool */
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.fc{position:relative;border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:10px;cursor:grab}
.fc.dragging{opacity:.4}
.fc.over{outline:2px solid var(--accent);outline-offset:2px}
.fc .ord{z-index:2;position:absolute;top:8px;left:8px;width:20px;height:20px;border-radius:6px;background:var(--text);color:var(--base);font-size:11px;font-weight:700;display:grid;place-items:center}
.fc .rm{z-index:2;position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--text3);background:var(--surface);opacity:0}
.fc:hover .rm{opacity:1}
.fc .nm{font-size:12.5px;font-weight:500;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc .mt{font-size:11.5px;color:var(--text3)}
.addc{border:1.5px dashed var(--border-subtle);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--text3);min-height:190px}
.addc:hover{color:var(--accent-text);border-color:var(--accent)}
/* a fake page */
.pg{aspect-ratio:1/1.414;background:var(--page);border:1px solid var(--border);border-radius:3px;position:relative;overflow:hidden;padding:12% 11%}
.pg i{display:block;height:4%;background:var(--page-line);border-radius:2px;margin-bottom:5%}
.pg i.h{height:7%;width:60%;background:color-mix(in oklab,var(--c) 45%,var(--page-line))}
.pg i.s{width:70%}
.pg .wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-weight:700;color:var(--wmc,#d93838);white-space:nowrap}
.pg .pn{position:absolute;font-size:9px;color:#71717a}
.worktop{display:flex;align-items:center;gap:10px;margin-bottom:14px;color:var(--text2);font-size:13px}
.worktop .sp{flex:1}
/* page grid (split, organize) */
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:14px}
.pc{position:relative;text-align:center;font-size:12px;color:var(--text3)}
.pc .pg{cursor:pointer;transition:transform .1s}
.pc.sel .pg{outline:2.5px solid var(--accent);outline-offset:2px}
.pc .ck{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border-subtle);background:var(--surface);display:grid;place-items:center}
.pc.sel .ck{background:var(--accent);border-color:var(--accent);color:#fff}
.pc .cut{position:absolute;right:-11px;top:30%;color:var(--accent-text)}
.pc.grp1 .pg{box-shadow:inset 0 -4px 0 #60a5fa}.pc.grp2 .pg{box-shadow:inset 0 -4px 0 #f59e0b}.pc.grp3 .pg{box-shadow:inset 0 -4px 0 #a78bfa}
/* preview for watermark */
.preview{display:flex;gap:24px;align-items:flex-start}
.preview .big{width:min(420px,60%)}
.preview .thumbs{display:flex;flex-direction:column;gap:10px;width:84px}
.preview .thumbs .pg{padding:10%}
/* background removal */
.ba{position:relative;width:min(560px,100%);aspect-ratio:4/3;border-radius:12px;overflow:hidden;border:1px solid var(--border);user-select:none}
.ba .l{position:absolute;inset:0}
.checker{background-color:#fff;background-image:linear-gradient(45deg,#e5e5e5 25%,transparent 25%),linear-gradient(-45deg,#e5e5e5 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e5e5e5 75%),linear-gradient(-45deg,transparent 75%,#e5e5e5 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
.ba .handle{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 0 1px rgb(0 0 0/.2)}
.ba .handle span{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:#fff;color:#333;display:grid;place-items:center;box-shadow:0 1px 4px rgb(0 0 0/.3)}
.ba .lab{position:absolute;top:10px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:rgb(0 0 0/.55);color:#fff}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:7px;border:1px solid var(--border)}
.sw.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
/* running and done */
.veil{position:absolute;inset:0;background:color-mix(in oklab,var(--base) 82%,transparent);display:grid;place-items:center;backdrop-filter:blur(2px)}
.prog{width:360px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:0 8px 30px rgb(0 0 0/.12)}
.bar{height:6px;background:var(--hover);border-radius:999px;overflow:hidden;margin:12px 0 8px}
.bar div{height:100%;background:var(--accent);border-radius:999px;transition:width .2s}
.result{max-width:820px;margin:8px auto 0}
.rhead{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.rhead .ok{width:30px;height:30px;border-radius:50%;background:color-mix(in oklab,var(--success) 18%,transparent);color:var(--success);display:grid;place-items:center}
.rhead h2{margin:0;font-size:18px}
.rcard{display:flex;gap:20px;border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:18px}
.rcard .pg{width:150px;height:212px;flex-shrink:0;padding:18px 16px}
.rcard .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.rcard .fn{display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px}
.rcard .fn input{font-weight:600;font-size:15px;border:1px solid transparent;border-radius:6px;padding:3px 6px;margin-left:-7px;background:transparent;width:100%;outline:none}
.rcard .fn input:hover{border-color:var(--border)}
.rcard .fn input:focus{border-color:var(--accent);background:var(--surface)}
.saving{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.delta{color:var(--success);font-weight:600}
.temp{font-size:12px;color:var(--text3);display:flex;align-items:center;gap:6px}
.next{margin-top:22px}
.next h4{font-size:13px;margin:0 0 8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px 0 6px;border:1px solid var(--border);border-radius:999px;background:var(--surface);font-size:13px}
.chip:hover{border-color:var(--accent)}
.chip .ic{width:24px;height:24px;border-radius:999px;display:grid;place-items:center}
.chip .ic svg.i{width:13px;height:13px}
.multi{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:10px;padding:8px 12px;background:var(--surface)}
.mrow .pg{width:34px;padding:4px}
.mrow .pg i{margin-bottom:12%}
.mrow .nm{flex:1;font-weight:500}
.mrow .mt{color:var(--text3);font-size:12.5px}
/* setup needed */
.setup{max-width:560px;margin:40px auto;border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:24px}
.setup h2{margin:0 0 6px;font-size:18px;display:flex;gap:10px;align-items:center}
.setup p{color:var(--text2);line-height:1.5;margin:6px 0}
.setup ol{color:var(--text2);line-height:1.7;padding-left:20px}
.setup .row{display:flex;gap:8px;margin-top:14px}
.note{display:flex;gap:10px;padding:10px 12px;border-radius:9px;background:var(--hover);color:var(--text2);font-size:13px;line-height:1.45}
/* smart drop sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0/.35);display:grid;place-items:center;z-index:50}
.sheet{width:520px;max-height:80vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 20px 60px rgb(0 0 0/.25)}
.sheet .hd{padding:16px 18px 10px;display:flex;align-items:center;gap:10px}
.sheet .hd h2{font-size:16px;margin:0;flex:1}
.sheet .fl{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 12px}
.fchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--hover);color:var(--text2)}
.sugg{padding:4px 8px 10px}
.sg{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:9px;text-align:left}
.sg:hover,.sg.kb{background:var(--hover)}
.sg .ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.sg .t{flex:1}
.sg .t b{display:block;font-weight:600}
.sg .t span{font-size:12.5px;color:var(--text2)}
.sg kbd{font-size:11px;color:var(--text3);border:1px solid var(--border);border-radius:4px;padding:0 5px}
.sheet .ft{border-top:1px solid var(--border);padding:10px 18px;font-size:12px;color:var(--text3);display:flex;justify-content:space-between}
/* global drop overlay */
.dropall{position:fixed;inset:10px;border:2.5px dashed var(--accent);border-radius:16px;background:color-mix(in oklab,var(--accent) 8%,transparent);display:grid;place-items:center;z-index:40;pointer-events:none;font-size:18px;font-weight:600;color:var(--accent-text)}
/* mockup-only controls, not part of the design */
.demo{position:fixed;right:14px;bottom:14px;display:flex;max-width:84px;overflow:hidden;white-space:nowrap;transition:max-width .2s;gap:6px;z-index:60;background:#111;color:#fff;border-radius:10px;padding:6px 8px;font-size:12px;align-items:center;box-shadow:0 4px 16px rgb(0 0 0/.3)}
.demo:hover{max-width:900px}
.demo button{color:#fff;padding:4px 8px;border-radius:6px;background:#333}
.demo button:hover{background:#444}
.demo span{opacity:.6;padding:0 4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--base);padding:9px 14px;border-radius:9px;font-size:13px;z-index:70;display:flex;gap:10px;align-items:center}
.toast button{color:var(--accent-text);font-weight:600}
.dark .toast button{color:#1a66cc}
</style>
</head>
<body>

  { id:'aconvert', cat:'media', icon:'music', name:'Đổi định dạng âm thanh', desc:'MP3, M4A, WAV, FLAC, OGG', accept:'audio', min:1, verb:()=>'Đổi', status:'na', why:'Cần macOS 14 trở lên' },

const tool = id => TOOLS.find(t => t.id === id);
const cat = id => CATS.find(c => c.id === id);

// ── State ──────────────────────────────────────────────────────────────────
const S = {
  view: 'home',          // home | tool

  q: '',
  catFilter: 'all',

  sheet: null,           // { kind, files }
  sheetIdx: 0,
  dragAll: false,
  setupState: {},        // libreoffice: missing | ok, pack: missing | installing | ok
  progress: 0,
  // tool options
  o: { split:'ranges', ranges:'1-3, 4-8, 9-12', every:4, wmMode:'text', wmText:'BẢN NHÁP — KHÔNG LƯU HÀNH', wmSize:44, wmOpacity:22, wmRot:-35, wmPos:4, wmColor:'#d93838', level:1, bg:'transparent', ba:52, sel:new Set([2,3,7]) },
  toast: null,
};

// ── Rendering helpers ──────────────────────────────────────────────────────
function page(c = '#1a66cc', extra = '') {
  return `<div class="pg" style="--c:${c}"><i class="h"></i><i></i><i></i><i class="s"></i><i></i><i></i><i class="s"></i><i></i><i></i><i class="s"></i>${extra}</div>`;
}
function chipIcon(t) { return `<span class="ic ${cat(t.cat).cls}">${ic(t.icon)}</span>`; }
function statusTag(t) {
  const st = effectiveStatus(t);
  if (st === 'setup') return `<span class="tag t-setup">Cần cài</span>`;
  if (st === 'na') return `<span class="tag t-na">${t.why}</span>`;
  return '';
}
function effectiveStatus(t) {
  if (t.status === 'setup' && S.setupState[t.need] === 'ok') return 'ready';
  return t.status || 'ready';
}

function rail() {
  const apps = ['waypoints','message-circle','zap','file-text','square-check','calendar','folder-open','palette','users','wallet','rss','boxes','key-round'];
  return `<nav class="rail">${apps.map(a => `<button title="${a}">${ic(a)}</button>`).join('')}
    <button class="on" title="Tiện ích">${ic('wrench')}</button><div class="sp"></div>
    <button title="Đổi giao diện sáng tối (chỉ mockup)" onclick="toggleDark()">${ic(document.documentElement.classList.contains('dark') ? 'sun' : 'moon')}</button>
    <button>${ic('settings')}</button></nav>`;
}

function sidebar() {
  const pinned = [...S.pins].map(tool);
  const counts = id => TOOLS.filter(t => t.cat === id).length;
  return `<aside class="side">
    <div class="top"><span class="badge">${ic('wrench')}</span><h2>Tiện ích</h2></div>
    <label class="search">${ic('search')}<input id="q" placeholder="Tìm công cụ…" value="${S.q}" oninput="setQ(this.value)"><kbd>/</kbd></label>
    <div class="sec">Đã ghim</div>
    ${pinned.map(t => `<button class="nav ${S.view==='tool'&&S.tool===t.id?'on':''}" onclick="openTool('${t.id}')">${ic(t.icon)}${t.name}</button>`).join('')}
    <div class="sec">Dùng gần đây</div>
    ${S.recent.filter(id => !S.pins.has(id)).map(tool).map(t => `<button class="nav ${S.view==='tool'&&S.tool===t.id?'on':''}" onclick="openTool('${t.id}')">${ic(t.icon)}${t.name}</button>`).join('')}
    <div class="sec">Nhóm</div>
    <button class="nav ${S.view==='home'&&S.catFilter==='all'?'on':''}" onclick="goHome('all')">${ic('layout-grid')}Tất cả<span class="n">${TOOLS.length}</span></button>
    ${CATS.map(c => `<button class="nav ${S.view==='home'&&S.catFilter===c.id?'on':''}" onclick="goHome('${c.id}')"><span class="dot" style="background:var(--c-${c.id})"></span>${c.name}<span class="n">${counts(c.id)}</span></button>`).join('')}
    <div class="sec">Kết quả chưa lưu</div>
    <button class="nav" onclick="showDone('merge')">${ic('file-stack')}<span>Hop-dong-day-du.pdf<span class="sub">Gộp PDF · tự xoá sau 21 giờ</span></span></button>
    <button class="nav" onclick="showDone('removebg')">${ic('eraser')}<span>san-pham-binh-gom.png<span class="sub">Tách nền · tự xoá sau 3 giờ</span></span></button>
    <div class="foot">${ic('info')}<span>Mọi việc chạy trên máy này. Không file nào được gửi lên mạng.</span></div>
  </aside>`;
}

function header() {
  if (S.view === 'home') {
    return `<header><div class="navb"><button>${ic('chevron-left')}</button><button>${ic('chevron-right')}</button></div>
      <div class="title"><span style="color:var(--accent-text)">${ic('wrench','lg')}</span><div><h1>Tiện ích</h1></div></div>
      <div class="acts"><button class="btn p" onclick="pickAny()">${ic('upload')}Chọn file…</button></div></header>`;
  }
  const t = tool(S.tool);
  const n = S.files.length;
  const ok = S.phase === 'loaded' && n >= t.min && (!t.max || n <= t.max) && effectiveStatus(t) === 'ready';
  const ready = effectiveStatus(t) === 'ready';
  const primary = !ready ? '' : S.phase === 'done'
    ? `<button class="btn s" onclick="redo()">${ic('undo-2')}Sửa và chạy lại</button>`
    : `<button class="btn p" ${ok ? '' : 'disabled'} onclick="run()">${ic(t.icon)}${t.verb(n || 1)}</button>`;
  return `<header><div class="navb"><button onclick="goHome()">${ic('chevron-left')}</button><button>${ic('chevron-right')}</button></div>
    <div class="title"><span class="ic ${cat(t.cat).cls}" style="width:30px;height:30px;border-radius:8px;display:grid;place-items:center">${ic(t.icon)}</span>
      <div style="min-width:0"><h1>${t.name}</h1></div><span class="subt">· ${t.desc}</span></div>
    <div class="acts">${S.phase==='loaded'&&(!t.max||S.files.length<t.max)?`<button class="btn g" onclick="addMore()">${ic('plus')}Thêm file</button>`:''}${primary}</div></header>`;
}

// ── Home ───────────────────────────────────────────────────────────────────
function home() {
  const q = S.q.trim().toLowerCase();
  const fold = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
  const match = t => !q || fold((t.name+' '+t.desc+' '+t.id).toLowerCase()).includes(fold(q));
  const cats = CATS.filter(c => S.catFilter === 'all' || S.catFilter === c.id);
  let html = `<div class="home">
    <div class="dropbar">${ic('folder-input','lg')}<div><b>Thả file vào bất cứ đâu trong Tiện ích</b><br>Synabit sẽ gợi ý việc làm được với loại file đó.</div>
      <button class="btn s sm" onclick="simulateDrop('pdf')">Thử thả 3 PDF</button><button class="btn s sm" style="margin-left:0" onclick="simulateDrop('img')">Thử thả 2 ảnh</button></div>`;
  let any = false;
  for (const c of cats) {
    const ts = TOOLS.filter(t => t.cat === c.id && match(t));
    if (!ts.length) continue;
    any = true;
    html += `<section class="grp"><h3><span class="dot" style="background:var(--c-${c.id})"></span>${c.name} <small>${c.note}</small></h3><div class="grid">`;
    for (const t of ts) {
      const st = effectiveStatus(t);
      html += `<button class="card ${st==='na'?'off':''}" onclick="openTool('${t.id}')" title="${st==='na'?t.why:''}">
        <span class="ic ${c.cls}">${ic(t.icon,'lg')}</span>
        <span style="min-width:0"><span class="nm">${t.name} ${statusTag(t)}</span><span class="ds" style="display:block">${t.desc}</span></span>
        <span class="pin ${S.pins.has(t.id)?'on':''}" onclick="event.stopPropagation();togglePin('${t.id}')" title="${S.pins.has(t.id)?'Bỏ ghim':'Ghim lên thanh bên'}">${ic('star')}</span>
      </button>`;
    }
    html += `</div></section>`;
  }
  if (!any) html += `<div class="empty-search">Không có công cụ nào khớp “${S.q}”.<br><span style="color:var(--text3);font-size:13px">Thử “gộp”, “nén”, “word”, “nền”.</span></div>`;
  return html + `</div>`;
}

// ── A tool ─────────────────────────────────────────────────────────────────
function toolView() {
  const t = tool(S.tool);
  const st = effectiveStatus(t);
  if (st === 'setup') return setupView(t);
  if (st === 'na') return `<div class="setup"><h2>${ic('info','lg')}${t.name} chưa có trên máy này</h2><p>${t.why}. Các công cụ video và âm thanh chạy ffmpeg trong phòng kín của Synabit, mà phòng kín cần macOS 14.</p><div class="row"><button class="btn s" onclick="goHome()">Về Tiện ích</button></div></div>`;
  if (S.phase === 'done') return doneView(t);
  return `<div class="tool"><div class="work" id="work">${S.phase==='empty' ? dropZone(t) : workspace(t)}${S.phase==='running'?runningVeil(t):''}</div>${S.phase==='empty'?'':`<aside class="opts">${options(t)}${outputOpts(t)}</aside>`}</div>`;
}

function dropZone(t) {
  const kinds = { pdf:'PDF', img:'ảnh (JPG, PNG, HEIC, WebP)', doc:'tài liệu Word', xls:'bảng tính', ppt:'bài trình chiếu', video:'video', audio:'âm thanh' };
  const many = !t.max || t.max > 1;
  return `<div class="dz" id="dz" ondragover="event.preventDefault();this.classList.add('hot')" ondragleave="this.classList.remove('hot')" ondrop="event.preventDefault();load()">
    <span class="big ic ${cat(t.cat).cls}">${ic(t.icon)}</span>
    <h2>${many ? 'Chọn' : 'Chọn một'} ${kinds[t.accept].split(' (')[0]}</h2>
    <p>hoặc kéo thả vào đây${t.min > 1 ? ` · cần ít nhất ${t.min} file` : ''}</p>
    <div class="row"><button class="btn p" onclick="load()">${ic('upload')}Chọn file…</button><button class="btn s" onclick="load()">${ic('folder-open')}Chọn từ Tệp</button></div>
    <div class="fine">Nhận ${kinds[t.accept]}. File gốc không bao giờ bị thay đổi.</div>
  </div>`;
}

function workspace(t) {
  if (t.id === 'split' || t.id === 'organize') return pageGrid(t);
  if (t.id === 'watermark') return watermarkPreview();
  if (t.id === 'removebg') return beforeAfter();
  const total = S.files.reduce((a, f) => a + (f.pages || 0), 0);
  const kind = t.accept === 'img' ? 'ảnh' : 'file';
  return `<div class="worktop">${S.files.length} ${kind}${total ? ` · ${total} trang` : ''}${t.id==='merge'?' · kéo để đổi thứ tự':''}<span class="sp"></span><button class="btn g sm" onclick="sortFiles()">Sắp theo tên</button><button class="btn g sm" onclick="clearFiles()">Bỏ hết</button></div>
    <div class="files" id="files">${S.files.map((f, i) => `
      <div class="fc" draggable="true" data-i="${i}" ondragstart="dragStart(event,${i})" ondragover="dragOver(event,${i})" ondragleave="this.classList.remove('over')" ondrop="dropOn(event,${i})" ondragend="dragEnd()">
        ${t.id==='merge'?`<span class="ord">${i+1}</span>`:''}<button class="rm" title="Bỏ file này" onclick="removeFile(${i})">${ic('x')}</button>
        ${f.pages ? page(f.c) : `<div class="pg" style="padding:0;aspect-ratio:1;background:linear-gradient(135deg,${f.c}33,${f.c}aa)"></div>`}
        <div class="nm" title="${f.name}">${f.name}</div><div class="mt">${f.pages ? f.pages + ' trang · ' : ''}${f.size}</div>
      </div>`).join('')}
      <button class="addc" onclick="addMore()">${ic('plus','lg')}<span>Thêm file</span></button>
    </div>`;
}

function pageGrid(t) {
  const n = 12;
  const groups = splitGroups();
  let html = `<div class="worktop">${S.files[0].name} · ${n} trang<span class="sp"></span>${t.id==='split'&&S.o.split==='pick'?`<span>${S.o.sel.size} trang đã chọn</span><button class="btn g sm" onclick="S.o.sel=new Set();render()">Bỏ chọn</button>`:''}</div><div class="pages">`;
  for (let p = 1; p <= n; p++) {
    const g = groups.findIndex(r => p >= r[0] && p <= r[1]);
    const sel = S.o.split === 'pick' && S.o.sel.has(p);
    const cut = S.o.split !== 'pick' && groups.some(r => r[1] === p) && p < n;
    html += `<div class="pc ${sel?'sel':''} ${S.o.split!=='pick'&&g>=0?'grp'+(g%3+1):''}" onclick="pickPage(${p})">
      ${page(p===1?'#d93838':'#71717a')}${S.o.split==='pick'?`<span class="ck">${sel?ic('check'):''}</span>`:''}${cut?`<span class="cut" title="Cắt ở đây">${ic('scissors')}</span>`:''}<div style="margin-top:5px">${p}</div></div>`;
  }
  return html + `</div>`;
}
function splitGroups() {
  if (S.o.split === 'every') { const g=[]; for (let s=1;s<=12;s+=+S.o.every||1) g.push([s,Math.min(12,s+(+S.o.every||1)-1)]); return g; }
  if (S.o.split === 'pick') return [];
  return S.o.ranges.split(',').map(s => s.trim()).filter(Boolean).map(s => { const [a,b] = s.split('-').map(Number); return [a, b || a]; }).filter(r => r[0] >= 1 && r[1] <= 12 && r[0] <= r[1]);
}

function watermarkPreview() {
  const o = S.o;
  const pos = ['flex-start','center','flex-end'];
  const wm = o.wmMode === 'text'
    ? `<div class="wm" style="align-items:${pos[Math.floor(o.wmPos/3)]};justify-content:${pos[o.wmPos%3]};padding:8%"><span style="transform:rotate(${o.wmRot}deg);opacity:${o.wmOpacity/100};font-size:${o.wmSize*0.42}px;color:${o.wmColor}">${o.wmText}</span></div>`
    : `<div class="wm" style="align-items:${pos[Math.floor(o.wmPos/3)]};justify-content:${pos[o.wmPos%3]};padding:8%"><span style="opacity:${o.wmOpacity/100};transform:rotate(${o.wmRot}deg);display:grid;place-items:center;width:38%;aspect-ratio:1;border-radius:50%;border:6px solid ${o.wmColor};color:${o.wmColor};font-size:13px">LOGO</span></div>`;
  const small = wm.replace(/font-size:[\d.]+px/, `font-size:${o.wmSize*0.08}px`).replace('font-size:13px','font-size:4px').replace('border:6px','border:2px');
  return `<div class="worktop">Xem trước trang 1 · ${S.files.reduce((a,f)=>a+f.pages,0)} trang trong ${S.files.length} file sẽ được đóng<span class="sp"></span></div>
    <div class="preview"><div class="big">${page('#d93838', wm)}</div>
    <div class="thumbs">${[1,2,3].map(()=>page('#71717a', small)).join('')}<div style="font-size:12px;color:var(--text3);text-align:center">+${S.files.reduce((a,f)=>a+f.pages,0)-3} trang</div></div></div>`;
}

    <path d="M200 70 c-6 -30 -30 -40 -44 -46 M200 70 c4 -30 24 -44 42 -50 M200 70 c0 -24 0 -40 -2 -56" stroke="#15803d" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="156" cy="24" r="9" fill="#ec4899"/><circle cx="242" cy="20" r="9" fill="#f59e0b"/><circle cx="198" cy="12" r="9" fill="#ef4444"/></svg>`;
}
function beforeAfter() {
  const o = S.o;
  const bgs = { transparent:'', white:'background:#fff', black:'background:#111', blue:'background:#dbeafe', green:'background:#dcfce7' };
  return `<div class="worktop">${S.files[0].name} · kéo thanh giữa để so trước và sau<span class="sp"></span>${S.files.length>1?`<span>Ảnh 1 / ${S.files.length}</span><button class="ib">${ic('chevron-left')}</button><button class="ib">${ic('chevron-right')}</button>`:''}</div>
    <div class="ba" id="ba" onpointerdown="baDown(event)">
      <div class="l" style="background:linear-gradient(160deg,#a8a29e,#57534e 60%,#292524)"><div style="position:absolute;left:8%;top:12%;width:30%;height:44%;background:#d6d3d1;opacity:.35;border-radius:4px"></div>${subject(false)}</div>

function runningVeil(t) {
  const n = S.files.length;
  return `<div class="veil"><div class="prog"><b>${t.verb(n).replace(/^\S+/, w => 'Đang ' + w.toLowerCase())}…</b>
    <div class="bar"><div style="width:${S.progress}%"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--text2)"><span>${t.id==='merge'?`Trang ${Math.round(S.progress*0.2)} / 20`:`${Math.min(n, Math.ceil(S.progress/100*n))} / ${n}`}</span><button class="btn g sm" onclick="cancel()">Huỷ</button></div></div></div>`;
}

// ── Options per tool ───────────────────────────────────────────────────────
function options(t) {
  const o = S.o;
  switch (t.id) {
    case 'merge': return `<div class="o"><h4>Tuỳ chọn</h4>
      <label class="row"><input type="checkbox" checked> Giữ mục lục (bookmark) của từng file</label>
      <label class="row"><input type="checkbox"> Thêm mục lục theo tên file</label>
      <label class="row"><input type="checkbox"> Chèn trang trắng giữa các file</label></div>`;
    case 'split': {
      const g = splitGroups();
      const count = o.split === 'pick' ? (o.sel.size ? 1 : 0) : g.length;
      return `<div class="o"><h4>Tách theo</h4><div class="seg">

function renderWork() { const w = document.getElementById('work'); if (w) { w.innerHTML = workspace(tool(S.tool)); const opts = document.querySelector('.opts'); if (opts && S.tool==='split') { opts.innerHTML = options(tool(S.tool)) + outputOpts(tool(S.tool)); } } }

// ── Actions ────────────────────────────────────────────────────────────────
function goHome(c) { S.view = 'home'; if (c) S.catFilter = c; S.tool = null; render(); }
function setQ(v) { S.q = v; S.view = 'home'; render(); }
function openTool(id) {
  S.view = 'tool'; S.tool = id; S.phase = 'empty'; S.files = [];
  S.recent = [id, ...S.recent.filter(x => x !== id)].slice(0, 3);
  render();
}
function kindOf(t) { return t.accept === 'pdf' ? 'pdf' : t.accept === 'img' ? 'img' : 'doc'; }
function load() {
  const t = tool(S.tool);
  let fs = SAMPLE[kindOf(t)].map(f => ({ ...f }));
  if (t.max) fs = fs.slice(0, t.max);
  if (t.id === 'split' || t.id === 'organize') fs = [{ ...SAMPLE.pdf[0] }];
  S.files = fs; S.phase = 'loaded'; render();
}
function addMore() {
  const t = tool(S.tool);
  const extra = t.accept === 'img' ? { name:'chan-dung.png', pages:0, size:'1,9 MB', c:'#0891b2' } : { name:'Giay-uy-quyen.pdf', pages:2, size:'310 KB', c:'#7c3aed' };
  if (t.max && S.files.length >= t.max) return;
  S.files.push(extra); render();
}
function removeFile(i) { S.files.splice(i, 1); if (!S.files.length) S.phase = 'empty'; render(); }
function clearFiles() { S.files = []; S.phase = 'empty'; render(); }
function sortFiles() { S.files.sort((a, b) => a.name.localeCompare(b.name)); render(); }
let dragI = null;
function dragStart(e, i) { dragI = i; e.currentTarget.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; }
function dragOver(e, i) { e.preventDefault(); e.stopPropagation(); if (i !== dragI) e.currentTarget.classList.add('over'); }
function dropOn(e, i) { e.preventDefault(); e.stopPropagation(); if (dragI === null || dragI === i) return; const [f] = S.files.splice(dragI, 1); S.files.splice(i, 0, f); dragI = null; render(); }
function dragEnd() { dragI = null; render(); }
function run() {
  S.phase = 'running'; S.progress = 0; render();
  const step = () => { if (S.phase !== 'running') return; S.progress += 7 + Math.random() * 9; if (S.progress >= 100) { S.progress = 100; S.phase = 'done'; render(); return; } render(); setTimeout(step, 110); };
  setTimeout(step, 110);
}
function cancel() { S.phase = 'loaded'; render(); }
function redo() { S.phase = 'loaded'; render(); }
function showDone(id) { openTool(id); load(); S.phase = 'done'; render(); }
function chain(id) {
  const t = tool(id);
  S.view = 'tool'; S.tool = id; S.phase = 'loaded';
  S.files = t.accept === 'img' ? [{ name:'san-pham-binh-gom.png', pages:0, size:'1,1 MB', c:'#c2410c' }] : [{ name:'Hop-dong-day-du.pdf', pages:20, size:'4,1 MB', c:'#d93838' }];
  render();
}
function saved(msg) { S.toast = msg; render(); clearTimeout(saved.t); saved.t = setTimeout(() => { S.toast = null; render(); }, 2600); }
function setO(k, v) { S.o[k] = v; render(); }
function liveO(k, el, unit = '') { S.o[k] = +el.value; el.nextElementSibling.textContent = el.value + unit; renderWork(); }
function togglePin(id) { S.pins.has(id) ? S.pins.delete(id) : S.pins.add(id); render(); }
function pickPage(p) {
  if (S.tool !== 'split' || S.o.split !== 'pick') return;
  S.o.sel.has(p) ? S.o.sel.delete(p) : S.o.sel.add(p); render();
}
function simulateDrop(kind) { S.sheet = { kind, files: SAMPLE[kind] }; S.sheetIdx = 0; render(); }
function fromSheet(id) {
  const files = S.sheet.files; S.sheet = null;
  openTool(id);
  const t = tool(id);
  if (effectiveStatus(t) === 'ready') { S.files = files.map(f => ({ ...f })).slice(0, t.max || 99); S.phase = 'loaded'; }
  render();
}
function pickAny() { simulateDrop('pdf'); }
function checkLO() { S.setupState.libreoffice = 'checking'; render(); setTimeout(() => { S.setupState.libreoffice = 'ok'; render(); }, 900); }
function installPack() {
  S.setupState.pack = 'installing'; S.progress = 0; render();
  const step = () => { S.progress += 6 + Math.random() * 8; if (S.progress >= 100) { S.setupState.pack = 'ok'; render(); return; } render(); setTimeout(step, 120); };
  setTimeout(step, 120);
}
let baDrag = false;
function baDown(e) { baDrag = true; baMove(e); }
function baMove(e) { if (!baDrag) return; const r = document.getElementById('ba')?.getBoundingClientRect(); if (!r) return; S.o.ba = Math.max(0, Math.min(100, (e.clientX - r.left) / r.width * 100)); renderWork(); }
addEventListener('pointermove', baMove); addEventListener('pointerup', () => baDrag = false);
function toggleDark() { document.documentElement.classList.toggle('dark'); render(); }
function resetAll() { Object.assign(S, { view:'home', tool:null, phase:'empty', files:[], q:'', catFilter:'all', sheet:null, setupState:{} }); render(); }

// A file dragged in from the desktop, anywhere on the home screen.
let dragDepth = 0;
addEventListener('dragenter', e => { if (e.dataTransfer?.types.includes('Files') && S.view === 'home') { dragDepth++; S.dragAll = true; render(); } });
addEventListener('dragleave', e => { if (S.dragAll && --dragDepth <= 0) { S.dragAll = false; render(); } });
addEventListener('dragover', e => { if (S.dragAll) e.preventDefault(); });
addEventListener('drop', e => { if (!S.dragAll) return; e.preventDefault(); dragDepth = 0; S.dragAll = false; const n = [...e.dataTransfer.files]; const img = n.length && n.every(f => f.type.startsWith('image/')); simulateDrop(img ? 'img' : 'pdf'); });
addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement?.tagName !== 'INPUT') { e.preventDefault(); document.getElementById('q')?.focus(); }
  if (e.key === 'Escape') { if (S.sheet) { S.sheet = null; render(); } else if (S.view === 'tool') goHome(); }
  if (S.sheet) {
    const items = document.querySelectorAll('.sg');
    if (e.key === 'ArrowDown') { S.sheetIdx = Math.min(items.length - 1, S.sheetIdx + 1); render(); }
    if (e.key === 'ArrowUp') { S.sheetIdx = Math.max(0, S.sheetIdx - 1); render(); }
    if (e.key === 'Enter') items[S.sheetIdx]?.click();
    if (/^[1-9]$/.test(e.key)) items[+e.key - 1]?.click();
  }
});
render();
</script>
</body>
</html>
