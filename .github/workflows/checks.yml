name: Checks

# Type-check, lint and every test suite, in one place so that nothing ships
# without them. Called by android.yml on every change, and by release.yml before
# any desktop build: a tag pushed on a red commit used to produce installers for
# three platforms regardless, since release.yml ran no tests at all.
on:
  workflow_call:
    inputs:
      ref:
        description: 'What to check out; empty means the commit that triggered the caller.'
        type: string
        default: ''

jobs:
  checks:
    name: Type-check, lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npx eslint 'src/**/*.{ts,vue}' --max-warnings 200

      - name: Frontend tests
        run: npx vitest run

      - uses: dtolnay/rust-toolchain@stable

      # Tauri links against the system webview, and on Linux that is WebKitGTK
      # found through pkg-config. Without these the crate does not compile at
      # all, so `cargo test` fails while building rather than while testing.
      #
      # Easy to miss from a Mac: macOS supplies WKWebView with the OS, so the
      # same command needs nothing installed there and passes locally. The list
      # matches the one release.yml already uses to build the Linux bundle,
      # minus patchelf, which is only needed when packaging one.
      - name: Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            pkg-config

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      # The protocol crate lives in its own workspace, so `cargo test` from the
      # server directory does not reach it. Its tests failed to compile for
      # weeks without anybody noticing for exactly that reason.
      - name: Protocol crate tests
        working-directory: sync-server
        run: cargo test -p synabit-protocol

      - name: Sync server tests
        working-directory: sync-server
        run: cargo test
