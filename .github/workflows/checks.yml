name: Checks

# Type-check, lint and every test suite, in one place so that nothing ships
# without them. Called by android.yml on every change, and by release.yml before
# any desktop build: a tag pushed on a red commit used to produce installers for
# three platforms regardless, since release.yml ran no tests at all.
on:
  workflow_call:
    inputs:
      ref:
        description: 'What to check out; empty means the commit that triggered the caller.'
        type: string
        default: ''

jobs:
  checks:
    name: Type-check, lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npx eslint 'src/**/*.{ts,vue}' --max-warnings 200

      - name: Frontend tests
        run: npx vitest run

      # Only what ships (--omit=dev) and only what is serious enough to act on:
      # the low and moderate advisories left need major upgrades of katex and
      # the typography plugin, which is a decision, not a CI gate.
      - name: Dependency advisories (npm)
        run: npm audit --omit=dev --audit-level=high

      - uses: dtolnay/rust-toolchain@stable

      # Tauri links against the system webview, and on Linux that is WebKitGTK
      # found through pkg-config. Without these the crate does not compile at
      # all, so `cargo test` fails while building rather than while testing.
      #
      # Easy to miss from a Mac: macOS supplies WKWebView with the OS, so the
      # same command needs nothing installed there and passes locally. The list
      # matches the one release.yml already uses to build the Linux bundle,
      # minus patchelf, which is only needed when packaging one.
      - name: Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            pkg-config

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Known vulnerabilities, licences and sources in the Rust tree; what is
      # deliberately accepted, and why, is listed in src-tauri/deny.toml.
      - name: Dependency advisories and licences (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml

      # --tests as well as --lib: tests/safe_cli.rs drives the real
      # synabit-safe binary, and `--lib` alone never built or ran it.
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib --tests

      # The protocol crate lives in its own workspace, so `cargo test` from the
      # server directory does not reach it. Its tests failed to compile for
      # weeks without anybody noticing for exactly that reason.
      - name: Protocol crate tests
        working-directory: sync-server
        run: cargo test -p synabit-protocol

      - name: Sync server tests
        working-directory: sync-server
        run: cargo test

  # macOS is where Synabit is used most, and the one platform the job above
  # never ran on: keychain, file-flush and path code all have Apple branches.
  rust-macos:
    name: Rust tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib --tests
