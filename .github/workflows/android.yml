name: Android

# Runs on every push and pull request that touches the app, not only on a tag.
#
# The reason is specific. The release build is the only one where R8 runs, and
# R8 is what removed the JNI methods the app needs to read its own encryption
# key — a defect that existed for weeks because nothing ever built a release
# AAB except by hand. A build that only happens at release time cannot catch a
# problem that only appears in a release build.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      # This job runs `cargo test -p synabit-protocol` and the sync server's
      # own tests, but did not wake for a change to either — the commit that
      # repaired the protocol crate's tests produced no run at all. The crate
      # whose tests broke unnoticed was also the one that could not trigger the
      # CI that tests it.
      - 'sync-server/**'
      # Four Rust tests read these JSON fixtures directly, through
      # CARGO_MANIFEST_DIR/../contracts/. Editing a contract can turn the suite
      # red, and without this nothing would run to say so.
      - 'contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'sync-server/**'
      - 'contracts/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  # Cheap gates first, so an obvious mistake does not wait behind a Rust build.
  checks:
    name: Type-check, lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npx eslint 'src/**/*.{ts,vue}' --max-warnings 200

      - name: Frontend tests
        run: npx vitest run

      - uses: dtolnay/rust-toolchain@stable

      # Tauri links against the system webview, and on Linux that is WebKitGTK
      # found through pkg-config. Without these the crate does not compile at
      # all, so `cargo test` fails while building rather than while testing.
      #
      # Easy to miss from a Mac: macOS supplies WKWebView with the OS, so the
      # same command needs nothing installed there and passes locally. The list
      # matches the one release.yml already uses to build the Linux bundle,
      # minus patchelf, which is only needed when packaging one.
      - name: Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      # The protocol crate lives in its own workspace, so `cargo test` from the
      # server directory does not reach it. Its tests failed to compile for
      # weeks without anybody noticing for exactly that reason.
      - name: Protocol crate tests
        working-directory: sync-server
        run: cargo test -p synabit-protocol

      - name: Sync server tests
        working-directory: sync-server
        run: cargo test

  aab:
    name: Signed release AAB
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install the pinned NDK
        # Must match ndkVersion in app/build.gradle.kts. Left to whatever the
        # image happens to ship, the same source produces different binaries on
        # different runners.
        run: sdkmanager --install "ndk;27.1.12297006"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Restore the signing keystore
        # Absent on a fork or a pull request from one; the build then produces
        # an unsigned bundle, which still proves the code compiles and that R8
        # did not eat anything.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing keystore available; the bundle will be unsigned."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/release.jks
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build AAB
        run: |
          # Resolve the NDK from whichever variable the setup action exported.
          export NDK_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk/27.1.12297006"
          test -d "$NDK_HOME" || { echo "::error::NDK not found at $NDK_HOME"; exit 1; }
          # arm64 for phones, x86_64 for Chromebooks and the emulators Play's
          # review runs on. The other two ABIs are 32-bit and are not shipped,
          # which is also why this is not `build:android` — that one builds all
          # four and would need Rust targets nothing here installs.
          npm run build:android:play

      # Without the mapping file a crash report from Play is unreadable, and
      # R8 renames on every build — a mapping kept only on the machine that
      # happened to run the build is a mapping you do not have.
      - name: Collect the R8 mapping
        if: always()
        run: |
          mkdir -p artifacts
          # -ipath, not -path. The directory AGP writes is `universalRelease`,
          # and -path is case sensitive, so '*release*' matched nothing at all —
          # the mapping was never collected and the check below silently skipped.
          find src-tauri/gen/android -name 'mapping.txt' -ipath '*release*' \
            -exec cp {} artifacts/mapping.txt \; || true
          ls -l artifacts || true

      - name: Verify the keep rule survived
        # The one check that would have caught the defect that made every
        # release build unusable: SecureStore is reached from Rust by name over
        # JNI, so R8 sees no callers and removes its methods unless the keep
        # rule in proguard-rules.pro holds them.
        run: |
          MAP=artifacts/mapping.txt
          # A release build always runs R8 — isMinifyEnabled is on for the
          # release type, signed or not — so by the time this step runs there
          # is always a mapping. Its absence means the collection step failed,
          # not that there was nothing to collect, and skipping on that made
          # this step report success having verified nothing at all.
          if [ ! -f "$MAP" ]; then
            echo "::error::No R8 mapping was collected. The release build produces one, so this means the collection step did not find it — the keep-rule check cannot run and must not pass."
            exit 1
          fi
          if ! grep -q 'com.synabit.app.SecureStore' "$MAP"; then
            echo "::error::SecureStore is absent from the R8 mapping — it was removed."
            exit 1
          fi
          for method in getSecret saveSecret; do
            if ! grep -q "$method" "$MAP"; then
              echo "::error::SecureStore.$method did not survive R8. The app cannot read its encryption key."
              exit 1
            fi
          done
          echo "SecureStore and its JNI methods survived R8."

      - name: Record what was built
        if: always()
        run: |
          {
            echo "commit: ${{ github.sha }}"
            echo "built:  $(date -u +%FT%TZ)"
            echo
            find src-tauri/gen/android -name '*.aab' -exec sha256sum {} \;
          } > artifacts/build-info.txt || true
          find src-tauri/gen/android -name '*.aab' -exec cp {} artifacts/ \; || true
          cat artifacts/build-info.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-release
          # The mapping is needed for as long as this build is installed on
          # anybody's phone; the default retention is far shorter than that.
          retention-days: 90
          path: artifacts/

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Android Lint
        working-directory: src-tauri/gen/android
        # Reports rather than fails: the project has never run this, so the
        # first run is a baseline to read, not a gate to trip over.
        run: ./gradlew lint --continue || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: src-tauri/gen/android/app/build/reports/
