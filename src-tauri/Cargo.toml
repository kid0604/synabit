[package]
name = "synabit"
version = "0.9.16"
description = "A unified, local-first productivity workspace"
authors = ["Synabit"]
edition = "2021"
default-run = "synabit"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "synabit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.1", features = [] }
dotenvy = "0.15"

[dependencies]
# `unstable` is here for exactly one thing: `Window::add_child`, which is how a
# second webview lives inside the main window. See `syn::pane` and
# `docs/syn-the-pane-2026-09-08.md`. Tauri may change this API in a minor
# release, and this app auto-updates — so it earns its place or it comes back
# out.
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-fs = "2.5.0"
gray_matter = "0.3.2"
walkdir = "2.5.0"
chrono = "0.4.44"
serde_yaml = "0.9.34"
opener = "0.8.4"
urlencoding = "2.1.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "multipart", "stream"] }
rustls = { version = "0.23", features = ["ring"] }
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
# SHA-1 for Safe's one-time codes (RFC 6238 is HMAC-SHA1 for nearly every
# site). Already in the build, Android included, through `zip`; naming it here
# adds no bytes.
sha1 = "0.11"
blake3 = "1"
notify = "6.1.1"
tauri-plugin-store = "2"
thiserror = "2.0.18"
rusqlite = { version = "0.39.0", features = ["bundled", "functions"] }
tauri-plugin-deep-link = "2.4.7"
uuid = { version = "1.23.1", features = ["v4"] }
infer = "0.19.0"
# The OS keychain on every desktop: without a platform's feature, keyring
# silently falls back to a mock store that keeps nothing — which is what
# Windows and Linux had, and every secret stored there was lost on restart.
# Linux: the kernel keyring in front of the Secret Service (GNOME Keyring,
# KWallet), with pure-Rust crypto for the session.
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
regex = "1.12.3"
tauri-plugin-os = "2"
tauri-plugin-log = "2.8.0"
log = "0.4.29"
base64 = "0.22"
rand = "0.9"
pulldown-cmark = "0.13.3"
lopdf = "0.34"
tauri-plugin-notification = "2"
loro = "0.16.9"
similar = "2.6.0"
async-trait = "0.1.89"
jni = "0.21"
chacha20poly1305 = "0.10.1"
argon2 = "0.5.3"
zeroize = "1.8.2"
bip39 = "2"
futures = "0.3"
zip = "8.6.0"
feed-rs = "2"
ammonia = "4"
opml = "1"
scraper = "0.22"
url = "2"
iroh = "1.0"
synabit_protocol = { package = "synabit-protocol", path = "../sync-server/synabit-protocol" }
postcard = { version = "1", features = ["alloc"] }
hex = "0.4"
# Auto-update
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Reading KeePass XML exports into Safe. Already in the build, Android
# included, through `feed-rs`; naming it adds no bytes.
quick-xml = "0.37"
# Opening KeePass databases (.kdbx 4) into Safe: AES-256-CBC or ChaCha20,
# and gzip. All three already in the build at these versions.
aes = "0.8"
chacha20 = "0.9"
flate2 = "1"
lz4_flex = "0.13.1"
chrono-tz = "0.10.4"
iana-time-zone = "0.1.65"
time = { version = "0.3.55", features = ["formatting"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
# A hotkey that works while another app is focused only exists on desktop;
# phones have share sheets and widgets instead.
tauri-plugin-global-shortcut = "2"
# Starting with the machine is what makes the hotkey available without the
# user having launched anything first.
tauri-plugin-autostart = "2"
# Reading and writing spreadsheets for Syn (`read_spreadsheet`,
# `write_spreadsheet`). Desktop only, for now, because every crate that reaches
# Android is a size review (`timeline::media::tests::REVIEWED_CRATES`) and this
# pair has not been through one. Measured in a stripped, LTO release binary on arm64,
# calamine adds about 0.8 MB and rust_xlsxwriter about 1.5 MB on top of the `zip`
# the app already ships, both reusing that `zip`. That is per ABI in an APK.
# On Android `read_spreadsheet` still reads CSV, with the few lines of parser it
# needs, and `write_spreadsheet` is not offered. Default features only:
# calamine's dates come back as serial numbers the tool formats itself, so
# `chrono` stays the one clock in the tree.
calamine = "0.36"
rust_xlsxwriter = "0.99"
# Safe copies a password to the clipboard from Rust, so the value never passes
# through the WebView, and marks it for clipboard managers and the Windows
# clipboard history to leave alone. Desktop only while Safe is: Android has its
# own ClipboardManager and a flag of its own, reached through JNI in P2.
arboard = { version = "3", default-features = false }
# Safe's password health: zxcvbn estimates the guesses a password takes —
# dictionaries, names, dates, keyboard walks, l33t — where our own estimate
# only knows runs and character classes. Measured before it was added: about
# 1.3 MB on a stripped, LTO, opt-level "s" arm64 binary. Desktop only, like
# calamine, until it has been through the Android size review; a phone falls
# back to `generator::estimate_bits`. No default features: the builder it
# offers is not used.
zxcvbn = { version = "3", default-features = false }
# Safe's SSH agent signs with Ed25519. Already in the build through iroh, at
# this exact version — named here, not added. Desktop only: the agent is a
# socket for `ssh` and `git`, which phones do not run.
ed25519-dalek = "=3.0.0-rc.0"

[target.'cfg(unix)'.dependencies]
# `mlock` for the page Safe keeps its keys in, and `setrlimit` to turn core
# dumps off while a Safe is open (`safe::memory`). Already in every build
# through the standard library's own dependencies; naming it adds no bytes.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# For sending the WKWebView an editing command Tauri has no API for — see
# `commands::paste`. Already in the tree through wry, so this is a name for it
# rather than a new crate.
objc2 = "0.6"

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1.1"
ctor = "0.2"

[dev-dependencies]
tempfile = "3"
# The mock runtime the command tests build an AppHandle from. Declared here
# rather than in [dependencies] so it is not compiled into a release binary:
# Cargo ignores dev-dependencies for an ordinary build and unifies them for
# `cargo test`, which is exactly the split wanted. Listed in [dependencies] it
# shipped the mock runtime to users.
tauri = { version = "2", features = ["test"] }

[features]
default = []

[profile.dev]
debug = 1
strip = "debuginfo"

